name: Check recipes

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-recipes.mjs
      - run: node recipes/brand-competitive-analysis/src/check-run.mjs recipes/brand-competitive-analysis/example/run.json
      - run: node recipes/emerging-market-validation/src/check-package.mjs recipes/emerging-market-validation/example/data.json recipes/emerging-market-validation/example/review.json recipes/emerging-market-validation/example/run.json
